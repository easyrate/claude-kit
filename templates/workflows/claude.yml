# Installed by claude-kit. The logic lives in easyrate/claude-kit; re-run the
# claude-kit install command to update this file.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    uses: easyrate/claude-kit/.github/workflows/claude.yml@main
    secrets: inherit
