# Installed by claude-kit. The logic lives in easyrate/claude-kit; re-run the
# claude-kit install command to update this file.
# Runs when you add the "agent-security-review" label to a PR.
name: Security review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: easyrate/claude-kit/.github/workflows/security-review.yml@main
    with:
      kit_ref: main
    secrets:
      # Passed explicitly: "inherit" only works when this repo and claude-kit are in the same org.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
