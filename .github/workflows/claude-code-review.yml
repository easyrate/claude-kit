# Reusable: runs Anthropic's /code-review plugin when a PR gets the "agent-review" label.
# Called from templates/workflows/claude-code-review.yml in each repo.
name: Claude Code Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    if: github.event.label.name == 'agent-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Install deps so Claude can type-check and test. Skipped in repos without an npm lockfile.
      # pull_request events check out the PR merge commit, so the generated Prisma client matches the PR.
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          if [ -f prisma/schema.prisma ]; then npx prisma generate; fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--model claude-opus-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(npx tsc:*),Bash(npm run lint:*),Bash(npx vitest:*),Bash(npm test:*)"'
