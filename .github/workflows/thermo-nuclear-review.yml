# Reusable: strict maintainability review when a PR gets the "agent-review" label.
# Called from templates/workflows/thermo-nuclear-review.yml in each repo.
# The skill text comes from this repo (claude-kit), so every repo reviews against the same version.
name: Thermo-nuclear review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    if: github.event.label.name == 'agent-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install deps so Claude can type-check and test. Skipped in repos without an npm lockfile.
      # pull_request events check out the PR merge commit, so the generated Prisma client matches the PR.
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          if [ -f prisma/schema.prisma ]; then npx prisma generate; fi

      - name: Fetch the review skill from claude-kit
        uses: actions/checkout@v4
        with:
          repository: easyrate/claude-kit
          path: .claude-kit
          sparse-checkout: plugins/easyrate-core/skills

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            Read .claude-kit/plugins/easyrate-core/skills/thermo-nuclear-code-quality-review/SKILL.md
            and follow it exactly to review this pull request's changes.
            Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`
            and read surrounding files as needed for context. Ignore the .claude-kit folder
            itself; it is not part of the PR.

            Tool rules for this environment: the only shell commands allowed are
            plain `gh pr diff`, `gh pr view`, `gh pr comment`, `npx tsc --noEmit`,
            `npm run lint`, `npx vitest run` and `npm test`, each run on its own
            with no pipes, redirects, `&&`/`;` chains, `cd`, loops or shell variables.
            If the repo has a tsconfig.json, run `npx tsc --noEmit` once and treat
            type errors in files this PR touches as findings.
            Do not write to /tmp or anywhere outside the workspace. Use the Read, Glob
            and Grep tools to inspect files, not shell commands.

            Post each specific finding as an inline comment on the relevant line.
            Then post one summary comment on the PR with `gh pr comment` that lists
            findings in the skill's priority order and gives a clear verdict
            against its approval bar. Do not modify any files.

          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(npx tsc:*),Bash(npm run lint:*),Bash(npx vitest:*),Bash(npm test:*)"
